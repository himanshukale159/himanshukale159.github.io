<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const phrases = ["Himanshu Kale","a Data Scientist"];
        let currentPhrase = 0;
        let letterCount = 0;
        let currentText = '';
        let isDeleting = false;
        let typingSpeed = 200;
    
        function type() {
            const element = document.getElementById('animated-text');
            const fullText = phrases[currentPhrase];
    
            if (isDeleting) {
                currentText = fullText.substring(0, letterCount - 1);
                letterCount--;
                typingSpeed = 70;
            } else {
                currentText = fullText.substring(0, letterCount + 1);
                letterCount++;
                typingSpeed = 200;
            }
    
            element.innerHTML = '<span class="typing">' + currentText + '</span>';
    
            if (!isDeleting && currentText === fullText) {
                typingSpeed = 2500; // Pause at end
                isDeleting = true;
            } else if (isDeleting && currentText === '') {
                isDeleting = false;
                currentPhrase++;
                if (currentPhrase >= phrases.length) currentPhrase = 0;
                typingSpeed = 500;
            }
    
            setTimeout(type, typingSpeed);
        }
    
        type(); // Start the typing effect on load
    });
</script>
